<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#030b1a">
    <title>Арсенал — Виртуальная футбольная биржа</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="gUp" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#19e68c" stop-opacity=".35"/>
            <stop offset="1" stop-color="#19e68c" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gDown" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff4558" stop-opacity=".3"/>
            <stop offset="1" stop-color="#ff4558" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4dffb0"/>
            <stop offset="1" stop-color="#0aa763"/>
        </linearGradient>
    </defs>
    <symbol id="i-wallet" viewBox="0 0 24 24">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/>
        <path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H5.5A2.5 2.5 0 0 1 3 7.5z"/>
        <circle cx="16.5" cy="14" r=".6"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24">
        <path d="M3 3v18h18"/>
        <path d="M7 15l4-4 3 3 6-7"/>
        <path d="M16 7h4v4"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M3 10h18M8 3v4M16 3v4"/>
        <path d="M8 14h2M12 14h2M16 14h.01M8 17.5h2M12 17.5h2"/>
    </symbol>
    <symbol id="i-news" viewBox="0 0 24 24">
        <rect x="4" y="3" width="16" height="18" rx="2"/>
        <path d="M8 8h8M8 12h8M8 16h5"/>
    </symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24">
        <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/>
        <path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <path d="M20 20l-4-4"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M15 5l-7 7 7 7"/>
    </symbol>
    <symbol id="i-next" viewBox="0 0 24 24">
        <path d="M9 5l7 7-7 7"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
        <path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.3L12 17l-5.6 3.2 1.3-6.3L3 9.6l6.3-.7z"/>
    </symbol>
    <symbol id="i-coins" viewBox="0 0 24 24">
        <ellipse cx="12" cy="6" rx="7" ry="3"/>
        <path d="M5 6v6c0 1.7 3 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3 3 7 3s7-1.3 7-3v-6"/>
    </symbol>
    <symbol id="i-growth" viewBox="0 0 24 24">
        <path d="M4 20V13M10 20V9M16 20v-6"/>
        <path d="M12 3l5 0 0 5M17 3l-8 7"/>
    </symbol>
    <symbol id="i-cup" viewBox="0 0 24 24">
        <path d="M8 21h8M12 16v5M7 3h10v6a5 5 0 0 1-10 0z"/>
        <path d="M7 5H4v1.5A3.5 3.5 0 0 0 7.5 10M17 5h3v1.5A3.5 3.5 0 0 1 16.5 10"/>
    </symbol>
    <symbol id="i-ball" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 8l3.5 2.5-1.3 4h-4.4l-1.3-4zM12 3v5M20 9.5l-4.5 1M17.5 19l-3.3-4.5M6.5 19l3.3-4.5M4 9.5l4.5 1"/>
    </symbol>
</svg>
<div class="gallery">
    <section class="phone " id="club" aria-label="club">

        <main class="content">
            <div class="topbar"><a class="iconbtn" href="quotes.html" aria-label="Назад">
                <svg class="ico ">
                    <use href="#i-back"/>
                </svg>
            </a>
                <button class="iconbtn fav" aria-label="В избранное">
                    <svg class="ico ">
                        <use href="#i-star"/>
                    </svg>
                </button>
            </div>
            <div class="chead"><img class="club-logo" src="img/4us2nCgl6kgZc0t3hpW75Q_64x64.png" alt="Арсенал">
                <div><h1>Арсенал</h1>
                    <div class="ctry"><i class="flag"></i>Англия</div>
                    <div class="cp">120 FC <span class="up">▲ +2,3%</span></div>
                </div>
            </div>
            <div class="seg sm" id="periods">
                <button class="" data-points="118,117,118.5,119,120,120"
                        data-labels="10:00,12:00,14:00,16:00,18:00,20:00">1Д
                </button>
                <button class="" data-points="112,114,113,117,118,120" data-labels="Пн,Вт,Ср,Чт,Пт,Сб">1Н</button>
                <button class="active"
                        data-points="96,100,98,104,102,108,112,109,115,118,114,121,119,123,117,126,124,128,121,127,125,131,129,134,132,128,126,130,133,135,131,134"
                        data-labels="10 ноя,17 ноя,24 ноя,1 дек">1М
                </button>
                <button class="" data-points="96,104,100,112,115,120" data-labels="Сен,Окт,Ноя,Дек">3М</button>
                <button class="" data-points="82,90,86,100,112,120" data-labels="Янв,Апр,Июл,Окт">1Г</button>
            </div>
            <div class="chart">
                <svg id="clubChart" viewBox="0 0 340 170" role="img" aria-label="График цены"></svg>
            </div>
            <div class="sec-head" style="margin-top:6px"><h2 class="sec">Ближайшие матчи</h2><a class="link"
                                                                                                href="calendar.html">Все
                <svg class="ico ">
                    <use href="#i-next"/>
                </svg>
            </a></div>
            <div class="card mrow">
                <div class="info">
                <div class="when"><b>12 ноя</b><span>22:00</span></div>
                <div class="bot">
                    <img class="mlogo" src="img/4us2nCgl6kgZc0t3hpW75Q_64x64.png" alt="">
                    <div class="mt"><b>Арсенал — Тоттенхэм</b><small>АПЛ</small></div>
                </div>
                </div>
                    <div class="side">

                        <svg class="warn" viewBox="0 0 18 16" aria-label="Предупреждение">
                            <path d="M9 .8 17.2 15.2H.8z" fill="#ff3348"/>
                            <text x="9" y="12.4" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">!</text>
                        </svg>
                    </div>
            </div>
            <div class="card mrow">
                <div class="info">
                <div class="when"><b>26 ноя</b><span>23:00</span></div>
                <div class="bot">
                    <img class="mlogo" src="img/4us2nCgl6kgZc0t3hpW75Q_64x64.png" alt="">
                    <div class="mt"><b>Арсенал — Брайтон</b><small>АПЛ</small></div>
                </div>
                </div>
                    <div class="side">
                        <svg class="opp gull" viewBox="0 0 64 64" aria-label="Брайтон">
                            <circle cx="32" cy="32" r="31" fill="#f4f7fb"/>
                            <circle cx="32" cy="32" r="24.5" fill="#0057b8"/>
                            <path fill="#f4f7fb" d="M8 36c7-8 12-14 18-13 2 5 4 7 6 7s4-2 6-7c6-1 11 5 18 13-8-4-14-2-24-2s-16-2-24 2z"/>
                            <circle cx="32" cy="34" r="2.2" fill="#f4f7fb"/>
                        </svg>
                    </div>
            </div>
            <div class="sec-head" style="margin:14px 0 4px"><h2 class="sec">Форма</h2></div>
            <div class="form"><i>В</i><i>В</i><i class="d">Н</i><i>В</i><i>В</i></div>
            <div class="trade"><a class="btn" href="portfolio.html">Купить</a><a class="btn red" href="portfolio.html">Продать</a>
            </div>
        </main>
        <nav class="tabbar"><a class="tab" href="portfolio.html">
            <svg class="ico ">
                <use href="#i-wallet"/>
            </svg>
            <span>Портфель</span></a><a class="tab active" href="quotes.html" aria-current="page">
            <svg class="ico ">
                <use href="#i-chart"/>
            </svg>
            <span>Котировки</span></a><a class="tab" href="calendar.html">
            <svg class="ico ">
                <use href="#i-calendar"/>
            </svg>
            <span>Календарь</span></a><a class="tab" href="news.html">
            <svg class="ico ">
                <use href="#i-news"/>
            </svg>
            <span>Новости</span></a><a class="tab" href="rating.html">
            <svg class="ico ">
                <use href="#i-trophy"/>
            </svg>
            <span>Рейтинг</span></a></nav>
    </section>
</div>
<script src="js/app.js"></script>
</body>
</html>
